<title>Livro de Receitas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #FAFAF6;
    --card: #FFFFFF;
    --ink: #202520;
    --muted: #6B7065;
    --accent: #3F6B3C;
    --accent-soft: #EDF2EA;
    --line: #E4E5DC;
    --note-bg: #F4F1E4;
    --note-edge: #C9BE8F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151814;
      --card: #1D211C;
      --ink: #E8E9E2;
      --muted: #9BA093;
      --accent: #8FB985;
      --accent-soft: #232B21;
      --line: #2C312A;
      --note-bg: #24231B;
      --note-edge: #6B6444;
    }
  }
  :root[data-theme="light"] {
    --bg: #FAFAF6; --card: #FFFFFF; --ink: #202520; --muted: #6B7065;
    --accent: #3F6B3C; --accent-soft: #EDF2EA; --line: #E4E5DC;
    --note-bg: #F4F1E4; --note-edge: #C9BE8F;
  }
  :root[data-theme="dark"] {
    --bg: #151814; --card: #1D211C; --ink: #E8E9E2; --muted: #9BA093;
    --accent: #8FB985; --accent-soft: #232B21; --line: #2C312A;
    --note-bg: #24231B; --note-edge: #6B6444;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 18px 56px; }

  /* ---------- header ---------- */
  .head-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 2rem;
    margin: 6px 0 2px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  header p {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .lang {
    display: flex;
    margin-top: 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    overflow: hidden;
    flex: 0 0 auto;
  }
  .lang button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 8px 13px;
    min-height: 38px;
    cursor: pointer;
  }
  .lang button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--bg);
  }

  /* ---------- list view ---------- */
  .search {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { border-color: var(--accent); }

  .chips {
    display: flex;
    gap: 8px;
    margin: 14px 0 18px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .chip {
    flex: 0 0 auto;
    padding: 7px 14px;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  .chip:focus-visible, .search:focus-visible, a:focus-visible,
  .ing li:focus-visible, .lang button:focus-visible, .copy:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 16px 14px;
    text-decoration: none;
    color: inherit;
  }
  .card h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 1.35rem;
    margin: 0 0 6px;
    color: var(--ink);
    text-wrap: balance;
  }
  .card .alt-title {
    margin: -2px 0 8px;
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
  .card .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .meta span { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .tag {
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  /* ---------- recipe view ---------- */
  .back {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
    margin-bottom: 14px;
    padding: 6px 0;
  }
  .recipe h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 1.9rem;
    line-height: 1.2;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .recipe .meta { margin-bottom: 14px; }

  .scale {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    overflow: hidden;
    margin: 0 0 14px;
  }
  .scale button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 14px;
    min-height: 38px;
    cursor: pointer;
  }
  .scale button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--bg);
  }

  .source { margin: 0 0 18px; font-size: 0.9rem; }
  .source a { color: var(--accent); }

  .pt-name {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 22px;
    font-size: 0.95rem;
  }
  .pt-name .label {
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    flex-basis: 100%;
  }
  .pt-name .name { font-style: italic; }
  .copy {
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 999px;
    padding: 4px 12px;
    min-height: 30px;
    cursor: pointer;
  }

  .recipe h2 {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 28px 0 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }

  .ing { list-style: none; margin: 0; padding: 0; }
  .ing li {
    padding: 10px 8px 10px 34px;
    position: relative;
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px;
    display: flex;
    align-items: center;
  }
  .ing li::before {
    content: "";
    position: absolute;
    left: 6px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    border: 1.5px solid var(--muted);
    border-radius: 5px;
  }
  .ing li.sub {
    cursor: default;
    padding-left: 8px;
    margin-top: 10px;
    min-height: 0;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ing li.sub::before { display: none; }
  .ing li.done { color: var(--muted); text-decoration: line-through; }
  .ing li.done::before {
    background: var(--accent);
    border-color: var(--accent);
  }
  .ing li.done::after {
    content: "";
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-62%) rotate(45deg);
    width: 5px; height: 9px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
  }

  .steps { margin: 0; padding: 0 0 0 6px; counter-reset: passo; list-style: none; }
  .steps li {
    counter-increment: passo;
    position: relative;
    padding: 0 0 18px 42px;
  }
  .steps li::before {
    content: counter(passo);
    position: absolute;
    left: 0; top: 1px;
    width: 27px; height: 27px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  .notes {
    background: var(--note-bg);
    border-left: 3px solid var(--note-edge);
    border-radius: 0 10px 10px 0;
    padding: 4px 16px;
    margin-top: 8px;
  }
  .notes ul { padding-left: 18px; margin: 12px 0; }
  .notes li { margin-bottom: 8px; }

  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }

  .hidden { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .chip, .card, .lang button, .copy { transition: border-color 120ms ease, background 120ms ease; }
    .card:active { border-color: var(--accent); }
  }
</style>

<div class="wrap">
  <div class="head-row">
    <header>
      <h1>Livro de Receitas</h1>
      <p id="subtitle">da nossa cozinha</p>
    </header>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="lang-pt" aria-pressed="true">PT</button>
      <button id="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div id="view-list">
    <input class="search" id="search" type="search"
           placeholder="Buscar receita ou ingrediente…" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="cards" id="cards"></div>
    <p class="empty hidden" id="empty">Nenhuma receita encontrada.</p>
    <footer id="foot-list"></footer>
  </div>

  <div id="view-recipe" class="hidden">
    <a class="back" id="back" href="#">← Todas as receitas</a>
    <article class="recipe" id="recipe"></article>
  </div>
</div>

    empty: "Nenhuma receita encontrada.",

    copied: "Copiado!",

    batchLabel: "Quantidade"

  en: {

    source: "Original recipe",
    batchLabel: "Batch size"

const $ = (id) => document.getElementById(id);
let lang = "pt";
let batch = "normal";               // "normal" | "dobro", reset per recipe
let categoria = "Todas";            // filter key, always the PT category name
const checked = {};                 // recipe id -> Set of checked ingredient indices
try { if (localStorage.getItem("lang") === "en") lang = "en"; } catch (e) {}

function categorias() {
  return ["Todas", ...new Set(RECIPES.map(r => r.pt.categoria))];
}
function catLabel(ptCat) {
  if (ptCat === "Todas") return UI[lang].all;
  if (lang === "pt") return ptCat;
  const r = RECIPES.find(x => x.pt.categoria === ptCat);
  return r ? r.en.categoria : ptCat;
}

function renderChips() {
  $("chips").innerHTML = categorias().map(c =>
    `<button class="chip" aria-pressed="${c === categoria}" data-cat="${c}">${catLabel(c)}</button>`
  ).join("");
}

function renderCards() {
  const q = $("search").value.trim().toLowerCase();
  const vis = RECIPES.filter(r => {
    const okCat = categoria === "Todas" || r.pt.categoria === categoria;
    const hay = (r.pt.titulo + " " + r.en.titulo + " "
      + r.pt.ingredientes.join(" ") + " " + r.en.ingredientes.join(" ")).toLowerCase();
    return okCat && (!q || hay.includes(q));
  });
  $("cards").innerHTML = vis.map(r => {
    const L = r[lang];
    const alt = lang === "en" ? `<p class="alt-title">${r.pt.titulo}</p>` : "";
    return `
    <a class="card" href="#${r.id}">
      <h2>${L.titulo}</h2>
      ${alt}
      <div class="meta">
        <span class="tag">${L.categoria}</span>
        <span>${r.tempo}</span>
        <span>${L.porcoes}</span>
      </div>
    </a>`;
  }).join("");
  $("empty").classList.toggle("hidden", vis.length > 0);
  $("foot-list").textContent = UI[lang].footer(RECIPES.length);
}

function renderRecipe(r) {
  const base = r[lang];
  /* Doubled versions are authored by hand, not computed — amounts are rounded to
     shoppable numbers and the method changes (batches, pans, timing) are real. */
  const L = (batch === "dobro" && base.dobro) ? { ...base, ...base.dobro } : base;
  const done = checked[r.id] || (checked[r.id] = new Set());
  const ptNameBox = lang === "en" ? `
    <div class="pt-name">
      <span class="label">${UI.en.otherName}</span>
      <span class="name" id="pt-name-text">${r.pt.titulo}</span>
      <button class="copy" id="copy-pt">${UI.en.copy}</button>
    </div>` : "";
  const scaleBox = base.dobro ? `
    <div class="scale" role="group" aria-label="${UI[lang].batchLabel}">
      <button data-batch="normal" aria-pressed="${batch === "normal"}">${base.porcoes}</button>
      <button data-batch="dobro" aria-pressed="${batch === "dobro"}">${base.dobro.rotulo}</button>
    </div>` : "";
  const sourceBox = r.fonte ? `
    <p class="source"><a href="${r.fonte}" target="_blank" rel="noopener noreferrer">${UI[lang].source} ↗</a></p>` : "";
  $("recipe").innerHTML = `
    <h1>${L.titulo}</h1>
    <div class="meta">
      <span class="tag">${L.categoria}</span>
      <span>${r.tempo}</span>
      <span>${L.porcoes}</span>
    </div>
    ${scaleBox}
    ${ptNameBox}
    ${sourceBox}
    <h2>${UI[lang].ingredients}</h2>
    <ul class="ing">
      ${L.ingredientes.map((i, idx) => i.endsWith(":")
        ? `<li class="sub">${i.slice(0, -1)}</li>`
        : `<li tabindex="0" role="checkbox" data-idx="${idx}"
            class="${done.has(idx) ? "done" : ""}"
            aria-checked="${done.has(idx)}">${i}</li>`).join("")}
    </ul>
    <h2>${UI[lang].method}</h2>
    <ol class="steps">${L.preparo.map(p => `<li>${p}</li>`).join("")}</ol>
    ${L.notas && L.notas.length ? `
      <h2>${UI[lang].notes}</h2>
      <div class="notes"><ul>${L.notas.map(n => `<li>${n}</li>`).join("")}</ul></div>` : ""}
  `;
  $("recipe").querySelectorAll(".scale button").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.batch === batch) return;
      batch = b.dataset.batch;
      /* Ingredient lists differ between batch sizes, so checkmarks don't carry over. */
      checked[r.id] = new Set();
      renderRecipe(r);
    });
  });
  $("recipe").querySelectorAll(".ing li[data-idx]").forEach(li => {
    const idx = Number(li.dataset.idx);
    const toggle = () => {
      done.has(idx) ? done.delete(idx) : done.add(idx);
      li.classList.toggle("done", done.has(idx));
      li.setAttribute("aria-checked", done.has(idx));
    };
    li.addEventListener("click", toggle);
    li.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); }
    });
  });
  const copyBtn = $("copy-pt");
  if (copyBtn) copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(r.pt.titulo);
      copyBtn.textContent = UI.en.copied;
      setTimeout(() => { copyBtn.textContent = UI.en.copy; }, 1600);
    } catch (e) {
      /* Clipboard blocked: select the name so a long-press copy works */
      const range = document.createRange();
      range.selectNodeContents($("pt-name-text"));
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });
}

function currentRecipe() {
  const id = location.hash.replace("#", "");
  return RECIPES.find(x => x.id === id) || null;
}

function renderAll() {
  $("subtitle").textContent = UI[lang].subtitle;
  $("search").placeholder = UI[lang].search;
  $("back").textContent = UI[lang].back;
  $("empty").textContent = UI[lang].empty;
  $("lang-pt").setAttribute("aria-pressed", lang === "pt");
  $("lang-en").setAttribute("aria-pressed", lang === "en");
  renderChips();
  renderCards();
  const r = currentRecipe();
  if (r) renderRecipe(r);
}

function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  renderAll();   /* re-renders in place: same view, filters, and checked items */
}

let lastId = null;
function route() {
  const r = currentRecipe();
  if (r && r.id !== lastId) batch = "normal";   /* each recipe opens at its normal size */
  lastId = r ? r.id : null;
  $("view-list").classList.toggle("hidden", !!r);
  $("view-recipe").classList.toggle("hidden", !r);
  if (r) { renderRecipe(r); window.scrollTo(0, 0); }
  else renderCards();
}

$("search").addEventListener("input", renderCards);
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  categoria = b.dataset.cat;
  renderChips();
  renderCards();
});
$("lang-pt").addEventListener("click", () => setLang("pt"));
$("lang-en").addEventListener("click", () => setLang("en"));
window.addEventListener("hashchange", route);

renderAll();
route();
</script>
